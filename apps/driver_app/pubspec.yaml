name: sigmile_driver
description: SIGmile driver-side mobile app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.8.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  http: ^1.2.2

  # Maps & navigation
  #   - flutter_map：Leaflet-style 跨平台地圖（Android/iOS/Web/Desktop 全支援）
  #   - flutter_map_location_marker：自帶藍點 + 跟隨用戶位置
  #   - geolocator：拿真實 GPS（Web 走 navigator.geolocation；HTTPS / localhost 才行）
  #   - latlong2：flutter_map 用的 LatLng 型別
  #   - TomTom Maps tile + Routing API（自由 2500 calls/day，純 REST，不需 native SDK）
  flutter_map: ^7.0.2
  flutter_map_location_marker: ^9.1.1
  geolocator: ^13.0.1
  geolocator_web: ^4.1.0
  latlong2: ^0.9.1
  permission_handler: ^11.3.1

  # Voice navigation：走系統 TTS（Android TextToSpeech / iOS AVSpeechSynthesizer
  # / Web SpeechSynthesis），完全免費、不用 API key
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
